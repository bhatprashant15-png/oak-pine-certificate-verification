<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAK AND PINE | Certificate Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #243b2a;
      text-align: center;
      padding: 40px 15px;
    }
    .card {
      background: white;
      max-width: 450px;
      margin: 30px auto;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 18px #00000012;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
      font-size: 16px;
    }
    input { border: 1px solid #aaa; }
    button {
      background: #243b2a;
      color: white;
      border: none;
      cursor: pointer;
    }
    #result { margin-top: 18px; }
    a { color: #243b2a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>OAK AND PINE</h1>
    <p>Certificate Verification Portal</p>
    <p>Enter your certificate ID to check its status.</p>

    <form id="verifyForm">
      <input id="certificateId"
        type="text"
        placeholder="Enter Certificate ID"
        required>
      <button type="submit">Verify Certificate</button>
    </form>

    <div id="result" aria-live="polite"></div>

    <p>
      <a href="https://oak-pine-groves.lovable.app">
        Visit OAK AND PINE Website
      </a>
    </p>
  </div>

  <script>
    document.getElementById("verifyForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("result").textContent =
        "Verification is not configured yet. Please contact OAK AND PINE.";
    });
  </script>
</body>
</html>
